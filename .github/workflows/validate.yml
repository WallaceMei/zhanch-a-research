name: validate-source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Check prohibited local artifacts
        run: |
          test -z "$(find . -type f \( -name '*.parquet' -o -name '*.csv' -o -name '*.log' -o -name '.env' \) -print -quit)"
